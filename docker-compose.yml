services:
  embedding-lb:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports:
      - "7860:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  embedding-e5:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    profiles: ["e5"]
    command: --model-id intfloat/multilingual-e5-small --max-concurrent-requests 2 --max-batch-tokens 1024
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.embedding.rule=PathPrefix(`/`)
      - traefik.http.routers.embedding.entrypoints=web
      - traefik.http.services.embedding.loadbalancer.server.port=80
      - traefik.http.services.embedding.loadbalancer.healthcheck.path=/health
      - traefik.http.services.embedding.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.embedding.loadbalancer.healthcheck.timeout=2s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3000M

  embedding-bge-m3:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    profiles: ["bge"]
    command: --model-id BAAI/bge-m3 --max-concurrent-requests 2 --max-batch-tokens 1024 --auto-truncate
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.embedding.rule=PathPrefix(`/`)
      - traefik.http.routers.embedding.entrypoints=web
      - traefik.http.services.embedding.loadbalancer.server.port=80
      - traefik.http.services.embedding.loadbalancer.healthcheck.path=/health
      - traefik.http.services.embedding.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.embedding.loadbalancer.healthcheck.timeout=2s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3000M

  embedding-minilm:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 --max-concurrent-requests 12 --max-batch-tokens 1024
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.embedding.rule=PathPrefix(`/`)
      - traefik.http.routers.embedding.entrypoints=web
      - traefik.http.services.embedding.loadbalancer.server.port=80
      - traefik.http.services.embedding.loadbalancer.healthcheck.path=/health
      - traefik.http.services.embedding.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.embedding.loadbalancer.healthcheck.timeout=2s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 3000M

  embedding-nomic:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    profiles: ["nomic"]
    command: --model-id nomic-ai/nomic-embed-text-v1.5 --max-concurrent-requests 2 --max-batch-tokens 1024 --auto-truncate
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.embedding.rule=PathPrefix(`/`)
      - traefik.http.routers.embedding.entrypoints=web
      - traefik.http.services.embedding.loadbalancer.server.port=80
      - traefik.http.services.embedding.loadbalancer.healthcheck.path=/health
      - traefik.http.services.embedding.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.embedding.loadbalancer.healthcheck.timeout=2s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3000M

  embedding-all-minilm:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    profiles: ["all-minilm"]
    command: --model-id sentence-transformers/all-MiniLM-L6-v2 --max-concurrent-requests 2 --max-batch-tokens 1024
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.embedding.rule=PathPrefix(`/`)
      - traefik.http.routers.embedding.entrypoints=web
      - traefik.http.services.embedding.loadbalancer.server.port=80
      - traefik.http.services.embedding.loadbalancer.healthcheck.path=/health
      - traefik.http.services.embedding.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.embedding.loadbalancer.healthcheck.timeout=2s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3000M
